name: Refresh Web Data

on:
  schedule:
    # GitHub Actions minimum interval is 5 minutes.
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Export web scan data
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
          flutter config --enable-linux-desktop
          flutter build linux -t tool/export_web_data.dart --release
          ./build/linux/x64/release/bundle/app12_weather

      - name: Build web
        run: flutter build web --release --base-href "/app12_weather/"

      - name: Copy web data into site
        run: mkdir -p build/web/data && cp web_data/*.json build/web/data/

      - name: Preserve existing APK on site
        run: curl -fL -o build/web/output.apk https://drowldev.github.io/app12_weather/output.apk
        continue-on-error: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
